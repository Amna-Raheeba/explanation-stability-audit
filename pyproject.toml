[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "explanation-stability-audit"
version = "0.1.0"
description = "Audit whether an agent's explanations survive perturbations that leave its answer unchanged — the explanation-flips-while-answer-holds paradox."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
